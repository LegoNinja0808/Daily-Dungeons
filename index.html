<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Dungeons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>DAILY DUNGEONS</h1>

    <div id="timer">
        23:59:59
    </div>

    <div class="main-container">

        <!-- Stats -->
        <div class="panel">
            <h2>Stats</h2>

            <div id="statsPreview">
                <p>Strength: ?</p>
                <p>Defense: ?</p>
                <p>Speed: ?</p>
                <p>Magic: ?</p>
                <p>Luck: ?</p>
            </div>

            <button id="rerollStats">
                Re-Roll Stats
            </button>
        </div>

        <!-- Power -->
        <div class="panel">
            <h2>Power</h2>

            <div id="powerPreview">
                <p>No Power Selected</p>
            </div>

            <button id="unlockPower">
                Unlock Power
            </button>
        </div>

    </div>

    <button id="play">
        Enter Dungeon
    </button>

    <button id="settings" class="settings-button">
        ⚙️
    </button>

    <!-- Stats Popup -->
    <div id="statsPopup" class="popup">
        <div class="popup-content">
            <h2>Re-Roll Stats</h2>

            <p>Your stat rolling screen will go here.</p>

            <button id="closeStats">
                Close
            </button>
        </div>
    </div>

    <!-- Power Popup -->
    <div id="powerPopup" class="popup">
        <div class="popup-content">
            <h2>Unlock Power</h2>

            <p>Your power unlock screen will go here.</p>

            <button id="closePower">
                Close
            </button>
        </div>
    </div>

    <!-- Settings -->
    <div id="settingsPopup" class="popup">
        <div class="popup-content">
            <h2>Settings</h2>

            <button id="closeSettings">
                Close
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
