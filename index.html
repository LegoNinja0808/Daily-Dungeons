<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Dungeons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>DAILY DUNGEONS</h1>

    <div id="timer">
        23:59:59
    </div>

    <button id="rerollStats">
        Re-Roll Stats
    </button>

    <button id="unlockPower">
        Unlock Power
    </button>

    <button id="play">
        Enter Dungeon
    </button>

    <button id="settings" class="settings-button">
        ⚙️
    </button>

    <div id="settingsPopup" class="popup">
        <div class="popup-content">
            <h2>Settings</h2>

            <button id="closeSettings">
                Close
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
